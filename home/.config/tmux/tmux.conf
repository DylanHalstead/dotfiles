set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g extended-keys on
# tmux 3.2–3.4 do not support the CSI-u format option.
if -F '#{>=:#{version},3.5}' 'set -g extended-keys-format csi-u'

# Let applications copy through tmux to the outer terminal (OSC 52).
set -s set-clipboard on
# Avoid clip.exe encoding and WSL interop dependencies for tmux-yank.
if-shell 'test -n "$WSL_DISTRO_NAME"' 'set -g @override_copy_command "tmux load-buffer -w -"'

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R


# Start windows and panes at 1, not 0
set -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows

bind -n M-H previous-window

bind -n M-L next-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'alexwforsythe/tmux-which-key'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Load plugins after defaults so clipboard bindings are not overwritten.
run '~/.config/tmux/plugins/tpm/tpm'

# Dracula status and pane colors. Keep this local rather than loading another
# theme plugin so the terminal palette remains the single source of color names.
set -g status-style 'bg=#282a36,fg=#f8f8f2'
set -g status-left '#[fg=#bd93f9,bold] #S '
set -g status-right '#[fg=#6272a4] %Y-%m-%d #[fg=#8be9fd]%H:%M '
set -g window-status-format ' #[fg=#6272a4]#I:#W '
set -g window-status-current-format ' #[bg=#44475a,fg=#f8f8f2,bold]#I:#W '
set -g pane-border-style 'fg=#44475a'
set -g pane-active-border-style 'fg=#bd93f9'
set -g message-style 'bg=#44475a,fg=#f8f8f2'
set -g mode-style 'bg=#bd93f9,fg=#282a36'

